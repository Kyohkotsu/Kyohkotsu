name: Update GitHub Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: Kyohkotsu
        run: |
          mkdir -p assets

          USER_JSON=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/$GH_USERNAME")

          REPOS=$(echo "$USER_JSON" | jq '.public_repos')

          PRS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/search/issues?q=author:$GH_USERNAME+type:pr" \
            --jq '.total_count')

          COMMITS=$(gh api graphql \
            -f query='
              query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    totalCommitContributions
                  }
                }
              }
            ' \
            -f login="$GH_USERNAME" \
            --jq '.data.user.contributionsCollection.totalCommitContributions')

          cat > assets/github-stats.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg"
               width="600"
               height="160"
               viewBox="0 0 600 160">

            <style>
              .title {
                font: 600 20px sans-serif;
                fill: #f0f6fc;
              }

              .number {
                font: 700 24px sans-serif;
                fill: #58a6ff;
              }

              .label {
                font: 14px sans-serif;
                fill: #8b949e;
              }

              .card {
                fill: #0d1117;
                stroke: #30363d;
              }
            </style>

            <rect
              class="card"
              x="1"
              y="1"
              width="598"
              height="158"
              rx="8"
            />

            <text x="30" y="40" class="title">
              GitHub Activity
            </text>

            <text x="75" y="95" text-anchor="middle" class="number">
              $COMMITS
            </text>

            <text x="75" y="120" text-anchor="middle" class="label">
              Commits
            </text>

            <text x="300" y="95" text-anchor="middle" class="number">
              $REPOS
            </text>

            <text x="300" y="120" text-anchor="middle" class="label">
              Repositories
            </text>

            <text x="525" y="95" text-anchor="middle" class="number">
              $PRS
            </text>

            <text x="525" y="120" text-anchor="middle" class="label">
              Pull Requests
            </text>

          </svg>
          EOF

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg

          git diff --cached --quiet || \
            git commit -m "chore: update GitHub stats"

          git push
